<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>


    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f7f7;
            color: #111;
            text-align: center;
        }


        .container {
            max-width: 650px;
            padding: 40px 24px;
        }


        .badge {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 50px;
            background: #111;
            color: white;
            font-size: 13px;
            margin-bottom: 25px;
        }


        h1 {
            font-size: 56px;
            line-height: 1.1;
            margin-bottom: 20px;
        }


        p {
            font-size: 19px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }


        .email {
            display: inline-block;
            padding: 14px 22px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }


        @media (max-width: 600px) {
            h1 {
                font-size: 40px;
            }


            p {
                font-size: 17px;
            }
        }
    </style>
</head>


<body>


    <div class="container">
        <div class="badge">COMING SOON</div>


        <h1>Something Great Is Coming.</h1>


        <p>
            We're working on something exciting.
            Stay tuned. We'll be launching soon.
        </p>


        <a class="email" href="mailto:hello@example.com">
            Get in touch
        </a>
    </div>


</body>
</html>
